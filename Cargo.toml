[workspace]
resolver = "2"
members = ["engine", "sim", "cli", "web", "neat"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"

# Release builds are what long trainings run on: fat LTO and a single codegen
# unit are about 3.5% faster on the evaluation workload (measured), at the
# price of a slower release build.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# One primary type per module, named after the module, is this
# project's convention (see docs/ARCHITECTURE.md) — this lint would
# otherwise fire on every module.
module_name_repetitions = "allow"
